<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8652D"/>
      <stop offset="100%" stop-color="#D4551F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,260)">
    <!-- saucer -->
    <ellipse cx="0" cy="80" rx="130" ry="24" fill="rgba(255,255,255,0.2)"/>
    <!-- cup body -->
    <path d="M-80,-40 L-70,60 L70,60 L80,-40 Z" fill="white" opacity="0.95"/>
    <!-- cup handle -->
    <path d="M80,-20 Q120,-20 120,10 Q120,40 80,40" fill="none" stroke="white" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
    <!-- coffee surface -->
    <ellipse cx="0" cy="-40" rx="80" ry="20" fill="#E8652D"/>
    <!-- steam -->
    <path d="M-25,-65 Q-20,-95 -30,-115" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.6">
      <animate attributeName="d" values="M-25,-65 Q-20,-95 -30,-115;M-25,-65 Q-30,-95 -20,-115;M-25,-65 Q-20,-95 -30,-115" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-70 Q5,-100 -5,-125" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.5">
      <animate attributeName="d" values="M0,-70 Q5,-100 -5,-125;M0,-70 Q-5,-100 5,-125;M0,-70 Q5,-100 -5,-125" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M25,-65 Q30,-90 20,-110" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.4">
      <animate attributeName="d" values="M25,-65 Q30,-90 20,-110;M25,-65 Q20,-90 30,-110;M25,-65 Q30,-90 20,-110" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
